version: '3'
services:
  test_fastapi:
    build:
      context: ..
      dockerfile: Dockerfile
    command: uvicorn tests.common.app_for_testing:testing_app --host 0.0.0.0
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=Testing
  tests:
    build:
      context: ..
      dockerfile: tests/Dockerfile
    command: pytest -vv --tb=long /internship-task/tests
    depends_on:
      - test_fastapi
    environment:
      - ENVIRONMENT=Testing
