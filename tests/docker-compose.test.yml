version: '3'
services:
  test_fastapi:
    build:
      context: ..
      dockerfile: Dockerfile
    command: uvicorn tests.common.app_for_testing:testing_app --host 0.0.0.0
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=Testing
  tests:
    build:
      context: ..
      dockerfile: tests/Dockerfile
    command: pytest -vv --tb=long /internship-task/tests
    depends_on:
      - test_fastapi
      - redis
      - rabbitmq
#      - celery
    environment:
      - ENVIRONMENT=Testing
  rabbitmq:
    container_name: test_rabbitmq
    image: rabbitmq:3-management
    restart: always
    ports:
      - "5673:5672"
      - "15673:15672"
#    environment:
#      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
#      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
  redis:
    container_name: test_redis
    image: redis:alpine
    restart: always
    ports:
      - "6380:6379"
